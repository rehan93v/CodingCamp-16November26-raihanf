<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List Life Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <section id="greeting-widget" class="greeting-widget" aria-label="Time and greeting">
        <h1 id="greeting-text" class="greeting-text">Good morning</h1>
        <div id="greeting-time" class="greeting-time" aria-label="Current time">--:--:-- --</div>
        <div id="greeting-date" class="greeting-date" aria-label="Current date">Loading date...</div>
      </section>
      <button id="theme-toggle" type="button" class="theme-toggle" data-action="toggle-theme" aria-label="Toggle light and dark theme">
        <span class="theme-toggle-icon" aria-hidden="true">&#9728;</span>
      </button>
    </header>

    <main class="main">
      <section id="focus-timer" class="focus-timer" aria-label="Pomodoro focus timer">
        <h2 class="widget-title">Focus Timer</h2>
        <div id="timer-display" class="timer-display" aria-label="Time remaining">25:00</div>
        <div class="timer-controls">
          <button type="button" class="timer-btn" data-action="start">Start</button>
          <button type="button" class="timer-btn" data-action="stop">Stop</button>
          <button type="button" class="timer-btn" data-action="reset">Reset</button>
        </div>
        <div class="timer-duration">
          <label for="timer-duration-input">Duration (min):</label>
          <input type="number" id="timer-duration-input" class="timer-duration-input" min="1" max="120" step="1" value="25" data-action="set-duration">
        </div>
        <div id="timer-message" class="timer-message" role="alert" aria-live="polite"></div>
      </section>

      <section id="task-list" class="task-list" aria-label="To-do list">
        <h2 class="widget-title">Tasks</h2>
        <div class="task-add-form">
          <input type="text" id="task-input" class="task-input" placeholder="Add a task..." maxlength="200" aria-label="New task text">
          <button type="button" class="task-add-btn" data-action="add">Add</button>
        </div>
        <div id="task-message" class="task-message" role="alert" aria-live="polite"></div>
        <div class="task-sort">
          <label for="task-sort-select">Sort by:</label>
          <select id="task-sort-select" class="task-sort-select" data-action="sort">
            <option value="created">Creation order</option>
            <option value="completion">Completion status</option>
          </select>
        </div>
        <ul id="task-items" class="task-items" aria-label="Task list">
        </ul>
      </section>
    </main>

    <aside id="quick-links" class="quick-links" aria-label="Quick links">
      <h2 class="widget-title">Quick Links</h2>
      <div id="quick-links-items" class="quick-links-items" aria-label="Saved quick links">
      </div>
      <div class="quick-links-add-form">
        <input type="text" id="quick-link-label-input" class="quick-link-label-input" placeholder="Label" maxlength="50" aria-label="Quick link label">
        <input type="url" id="quick-link-url-input" class="quick-link-url-input" placeholder="https://example.com" aria-label="Quick link URL">
        <button type="button" class="quick-link-add-btn" data-action="add-link">Add Link</button>
      </div>
      <div id="quick-link-message" class="quick-link-message" role="alert" aria-live="polite"></div>
    </aside>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
